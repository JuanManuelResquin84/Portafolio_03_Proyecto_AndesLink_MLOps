name: CI Proyecto AndesLink

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    # Configura DVC en la máquina virtual de GitHub
    - name: Configurar DVC
      uses: iterative/setup-dvc@v1

    # Configura las credenciales de DagsHub en DVC usando Secrets seguros
    - name: Configurar almacenamiento remoto de DVC
      run: |
        dvc remote modify origin --projecturl https://dagshub.com/JuanManuelResquin84/Portafolio_03_Proyecto_AndesLink_MLOps.dvc
        dvc remote modify origin --user ${{ secrets.DAGSHUB_USERNAME }}
        dvc remote modify origin --password ${{ secrets.DAGSHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_churn_env2.txt
        pip install pytest

    # Se descarga el archivo .pkl REAL desde DagsHub antes del test
    - name: Descargar artefactos de DVC
      run: |
        dvc pull -r origin

    - name: Ejecutar pruebas con Pytest
      run: |
        pytest