services:
  api:
    build: .
    container_name: andeslink_api_container
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - andeslink_network

  evidently:
    build:
      context: .
      dockerfile: Dockerfile.evidently
    container_name: andeslink_evidently_container
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - andeslink_network
    command: evidently ui --host 0.0.0.0 --port 8000 --workspace /app/workspace
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: andeslink_prometheus_container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - andeslink_network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: andeslink_grafana_container
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - andeslink_network
    depends_on:
      - prometheus

  monitor:
    build: .
    container_name: andeslink_monitor_container
    command: python script/push_to_ui.py
    volumes:
      - .:/app
    networks:
      - andeslink_network
    depends_on:
      api:
        condition: service_started
      evidently:
        condition: service_healthy
    restart: unless-stopped

networks:
  andeslink_network:
    driver: bridge